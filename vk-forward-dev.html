<!doctype html>
<!-- Dev replica of the forward window (VKForwardModal): the exact DOM the
     component renders — the modal over the dimmed layer, the search field, the
     recent-chats strip of the search window, the dialog rows with the check
     column, the topics of an expanded forum, the comment field and the foot.
     Only vk-base.scss is loaded; the avatars are mocks (Web K's .avatar styles
     are absent here). Clicks toggle the picking the way the component does.
     Served by `pnpm start` at /vk-forward-dev.html -->
<html class="is-vkgram">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VKgram — пересылка (dev)</title>
  <script type="module" src="/vk-forward-dev.ts"></script>
  <style>
    html, body { margin: 0; min-height: 100%; }
    .vkgram { min-height: 100vh; }
    .vk-forward-dev-note {
      padding: 6px 10px;
      color: var(--vk-text-secondary);
      font-size: 11px;
    }
    /* mock avatar: Web K's .avatar styles are absent on a dev page; two classes,
       чтобы перебить фон обёртки .vk-peer-avatar из vk-base.scss */
    .vkgram .avatar-mock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #7d9cc0, #597da3) !important;
      color: #fff;
      font-weight: bold;
      flex: none;
    }
    .vk-forward-dev-toggle {
      margin: 0 10px 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="vkgram">

  <template id="vk-check-template">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 12.5 11 15.5 16.5 9"/></svg>
  </template>

  <p class="vk-forward-dev-note">окно пересылки — полоса недавних как в поиске, строки с чекбоксами, форум раскрывается в темы</p>
  <button type="button" class="vk-link-button vk-forward-dev-toggle" id="night-toggle">ночная тема</button>

  <div class="vk-desktop-main">
    <div class="vk-content" style="padding: 10px; color: var(--vk-text-secondary); min-height: 300px;">контент страницы</div>
  </div>

  <div class="vk-modal-layer">
    <div class="vk-modal" role="dialog" aria-modal="true" aria-labelledby="vk-forward-dev-title" style="--vk-modal-width: 420px;" tabindex="-1">
      <div class="vk-modal-head">
        <h2 id="vk-forward-dev-title" class="vk-modal-title">Переслать</h2>
        <button type="button" class="vk-link-button vk-modal-close" aria-label="Закрыть" title="Закрыть">
          <svg class="vk-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="vk-modal-body vk-forward">
        <input type="text" class="vk-search" placeholder="Поиск" aria-label="Поиск">

        <!-- недавние чаты: та же полоса, что у окна поиска; выбранный — кольцо и галка -->
        <div class="vk-search-strip-block vk-forward-strip-block">
          <ul class="vk-search-strip vk-forward-strip" aria-label="Недавние чаты">
            <li>
              <button type="button" class="vk-search-strip-item vk-forward-strip-item" title="Иван Иванов" aria-pressed="false">
                <span class="vk-forward-strip-avatar">
                  <span class="avatar-mock vk-peer-avatar" style="width: 48px; height: 48px; font-size: 16px;">ИИ</span>
                </span>
                <span class="vk-search-strip-name">Иван Иванов</span>
              </button>
            </li>
            <li>
              <button type="button" class="vk-search-strip-item vk-forward-strip-item is-picked" title="Бади" aria-pressed="true">
                <span class="vk-forward-strip-avatar">
                  <span class="avatar-mock vk-peer-avatar" style="width: 48px; height: 48px; font-size: 16px;">Б</span>
                  <span class="vk-forward-strip-check" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 12.5 11 15.5 16.5 9"/></svg></span>
                </span>
                <span class="vk-search-strip-name">Бади</span>
              </button>
            </li>
            <li>
              <button type="button" class="vk-search-strip-item vk-forward-strip-item" title="Daniel" aria-pressed="false">
                <span class="vk-forward-strip-avatar">
                  <span class="avatar-mock vk-peer-avatar" style="width: 48px; height: 48px; font-size: 16px;">D</span>
                </span>
                <span class="vk-search-strip-name">Daniel</span>
              </button>
            </li>
          </ul>
        </div>

        <p class="vk-page-text vk-page-text-secondary vk-forward-count">Выбрано: 1</p>

        <ul class="vk-peer-list vk-picker-list vk-chats-picker-list vk-forward-list">
          <li>
            <button type="button" class="vk-picker-row vk-peer-row-clickable" aria-pressed="false">
              <span class="avatar-mock vk-peer-avatar" style="width: 40px; height: 40px; font-size: 14px;">ИИ</span>
              <span class="vk-picker-info"><span class="vk-picker-title">Иван Иванов</span></span>
              <span class="vk-chats-picker-check" aria-hidden="true"></span>
            </button>
          </li>
          <li>
            <button type="button" class="vk-picker-row vk-peer-row-clickable is-current" aria-pressed="true">
              <span class="avatar-mock vk-peer-avatar" style="width: 40px; height: 40px; font-size: 14px;">Б</span>
              <span class="vk-picker-info"><span class="vk-picker-title">Бади</span></span>
              <span class="vk-chats-picker-check is-checked" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 12.5 11 15.5 16.5 9"/></svg></span>
            </button>
          </li>
          <li>
            <button type="button" class="vk-picker-row vk-peer-row-clickable is-expanded" aria-expanded="true">
              <span class="avatar-mock vk-peer-avatar" style="width: 40px; height: 40px; font-size: 14px;">Г</span>
              <span class="vk-picker-info"><span class="vk-picker-title">Группа с темами</span></span>
              <svg class="vk-icon vk-forward-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
            </button>
            <ul class="vk-forward-topics">
              <li>
                <button type="button" class="vk-picker-row vk-peer-row-clickable vk-forward-topic" aria-pressed="false">
                  <span class="vk-forward-topic-fallback" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="m5.5 8 5.3 3.8c.7.5 1.7.5 2.4 0L18.5 8"/></svg></span>
                  <span class="vk-picker-info"><span class="vk-picker-title">Общие</span></span>
                  <span class="vk-chats-picker-check" aria-hidden="true"></span>
                </button>
              </li>
              <li>
                <button type="button" class="vk-picker-row vk-peer-row-clickable vk-forward-topic is-current" aria-pressed="true">
                  <span class="vk-forward-topic-fallback" aria-hidden="true" style="background: #6fb9f0;"></span>
                  <span class="vk-picker-info"><span class="vk-picker-title">Тема о котиках</span></span>
                  <span class="vk-chats-picker-check is-checked" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 12.5 11 15.5 16.5 9"/></svg></span>
                </button>
              </li>
            </ul>
          </li>
          <li>
            <button type="button" class="vk-picker-row vk-peer-row-clickable" aria-pressed="false">
              <span class="avatar-mock vk-peer-avatar" style="width: 40px; height: 40px; font-size: 14px;">К</span>
              <span class="vk-picker-info"><span class="vk-picker-title">Канал о погоде</span></span>
              <span class="vk-chats-picker-check" aria-hidden="true"></span>
            </button>
          </li>
        </ul>

        <button type="button" class="vk-link-button vk-forward-more">Показать ещё</button>

        <div class="vk-field-row vk-forward-comment">
          <label for="vk-forward-dev-comment">Комментарий</label>
          <input id="vk-forward-dev-comment" class="vk-input" type="text" placeholder="Необязательно" autocomplete="off">
        </div>
      </div>

      <div class="vk-modal-foot">
        <button type="button" class="vk-button vk-button-secondary">Отмена</button>
        <button type="button" class="vk-button">Переслать</button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
